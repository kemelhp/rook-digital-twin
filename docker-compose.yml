version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: digital_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco -d digital_twin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      SESSION_SECRET: "change-me-in-production"
      SESSION_COOKIE_NAME: "rook_session"
      SESSION_TTL_HOURS: "24"
      SESSION_COOKIE_SECURE: "false"
      DEFAULT_ADMIN_EMAIL: "admin@rook.local"
      DEFAULT_ADMIN_PASSWORD: "ChangeMe123!"
      DEFAULT_ADMIN_NAME: "Operations Admin"
      DEFAULT_STAFF_EMAIL: "staff@rook.local"
      DEFAULT_STAFF_PASSWORD: "ChangeMe123!"
      DEFAULT_STAFF_NAME: "Dispatch Staff"
      SIMULATOR_FREQUENCY_HZ: "1"
      SIMULATOR_LOCO_TYPE: "TE33A"
      HISTORY_RETENTION_HOURS: "72"
      DATABASE_URL: "postgresql+asyncpg://loco:loco@db:5432/digital_twin"
    volumes:
      - ./config:/app/config
    restart: unless-stopped

  web:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
      NEXT_PUBLIC_SESSION_COOKIE_NAME: "rook_session"
      API_SERVER_URL: "http://api:8000"
    restart: unless-stopped

volumes:
  postgres_data:
