version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: digital_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco -d digital_twin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      AUTH_USERNAME: "admin"
      AUTH_PASSWORD: "changeme"
      SIMULATOR_FREQUENCY_HZ: "1"
      SIMULATOR_LOCO_TYPE: "TE33A"
      HISTORY_RETENTION_HOURS: "72"
      DATABASE_URL: "postgresql+asyncpg://loco:loco@db:5432/digital_twin"
    volumes:
      - ./config:/app/config
    restart: unless-stopped

volumes:
  postgres_data:
