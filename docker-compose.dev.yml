services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  web:
    command: sh -c "if [ ! -x node_modules/.bin/next ]; then bun install; fi && bunx next dev --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./web-app:/app
      - /app/node_modules
